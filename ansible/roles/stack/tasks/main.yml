---
- name: Générer le docker-compose de l'environnement {{ env_name }}
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ deploy_dir }}/docker-compose.yml"
    mode: "0644"

- name: Déployer les conteneurs (docker compose up -d)
  community.docker.docker_compose_v2:
    project_src: "{{ deploy_dir }}"
    project_name: "netdevops-{{ env_name }}"
    build: "{{ stack_build }}"
    state: present
    wait: true
    wait_timeout: 120
  register: stack_result
  # Réseau instable (téléchargement des images) : jusqu'à 3 nouvelles tentatives
  retries: 3
  delay: 15
  until: stack_result is succeeded

- name: Afficher l'état des conteneurs
  ansible.builtin.debug:
    msg: "{{ stack_result.containers | map(attribute='Name') | list }}"
