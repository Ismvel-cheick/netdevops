# dnsmasq — DNS interne du LAN (domaine pme.local)
# Ce fichier sera généré par le rôle Ansible "dnsmasq" à l'étape 4.

# Ne pas lire /etc/resolv.conf : on choisit nous-mêmes les résolveurs amont
no-resolv
server=1.1.1.1
server=8.8.8.8

# Zone locale : jamais transmise à l'extérieur
domain=pme.local
local=/pme.local/
expand-hosts

# Enregistrements internes
host-record=www.pme.local,172.20.1.10
host-record=fw.pme.local,172.20.2.1
host-record=dns.pme.local,172.20.2.10
host-record=monitoring.pme.local,172.20.3.10
host-record=client1.pme.local,172.20.2.100
host-record=client2.pme.local,172.20.2.101

# Sécurité / performance
# Ne transmet pas les noms sans domaine
domain-needed
# Ne transmet pas les requêtes inverses sur les plages privées
bogus-priv
# Protection contre le DNS rebinding
stop-dns-rebind
rebind-domain-ok=/pme.local/
cache-size=1000

# Journalisation des requêtes (utile pour l'audit)
log-queries
