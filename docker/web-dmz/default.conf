# Ce fichier sera généré par le rôle Ansible "nginx" à l'étape 4.
server_tokens off;   # masque la version de Nginx

# HTTP -> redirection permanente vers HTTPS
server {
    listen 80;
    server_name www.pme.local;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name www.pme.local;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # En-têtes de sécurité
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Statut Nginx pour la supervision (lu par nginx-exporter), réservé au réseau MGMT
server {
    listen 8080;
    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.20.3.0/24;
        deny all;
    }
}
