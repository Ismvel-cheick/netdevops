# =============================================================================
# NetDevOps — services déployés et réseaux isolés
#   dmz-net  172.20.1.0/24 : web-dmz
#   lan-net  172.20.2.0/24 : dns-lan, client1, client2   (internal : pas d'accès direct à Internet)
#   mgmt-net 172.20.3.0/24 : supervision (Prometheus / Grafana, étape 5)
# router-fw est le SEUL conteneur connecté aux 3 réseaux : tout flux inter-zones
# passe par lui et par ses règles nftables.
# La passerelle Docker de chaque réseau est en .254 pour laisser l'adresse .1 au routeur.
# =============================================================================
name: netdevops

services:

  router-fw:
    build: ./docker/router-fw
    image: netdevops/router-fw:latest
    container_name: router-fw
    hostname: router-fw
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.rp_filter: 0
    # Ports 80/443 de la VM déjà pris (Apache) : on publie sur 8080/8443.
    # Côté conteneur, le routeur reçoit toujours sur 80/443 et fait le DNAT vers web-dmz.
    ports:
      - "8080:80"
      - "8443:443"
    networks:
      dmz-net:
        ipv4_address: 172.20.1.1
        gw_priority: 100        # la sortie Internet du routeur passe par la DMZ
      lan-net:
        ipv4_address: 172.20.2.1
      mgmt-net:
        ipv4_address: 172.20.3.1
    restart: unless-stopped

  web-dmz:
    build: ./docker/web-dmz
    image: netdevops/web-dmz:latest
    container_name: web-dmz
    hostname: web-dmz
    cap_add: [NET_ADMIN]      # uniquement pour fixer la route par défaut
    networks:
      dmz-net:
        ipv4_address: 172.20.1.10
    depends_on: [router-fw]
    restart: unless-stopped

  dns-lan:
    build: ./docker/dns-lan
    image: netdevops/dns-lan:latest
    container_name: dns-lan
    hostname: dns-lan
    cap_add: [NET_ADMIN]
    networks:
      lan-net:
        ipv4_address: 172.20.2.10
    depends_on: [router-fw]
    restart: unless-stopped

  client1:
    build: ./docker/client
    image: netdevops/client:latest
    container_name: client1
    hostname: client1
    cap_add: [NET_ADMIN, NET_RAW]
    dns: [172.20.2.10]
    networks:
      lan-net:
        ipv4_address: 172.20.2.100
    depends_on: [router-fw, dns-lan]
    restart: unless-stopped

  client2:
    image: netdevops/client:latest   # même image que client1 (construite par client1)
    pull_policy: never
    container_name: client2
    hostname: client2
    cap_add: [NET_ADMIN, NET_RAW]
    dns: [172.20.2.10]
    networks:
      lan-net:
        ipv4_address: 172.20.2.101
    depends_on: [router-fw, dns-lan, client1]
    restart: unless-stopped

networks:
  dmz-net:
    name: dmz-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24
          gateway: 172.20.1.254
  lan-net:
    name: lan-net
    driver: bridge
    internal: true            # le LAN ne sort que via router-fw
    ipam:
      config:
        - subnet: 172.20.2.0/24
          gateway: 172.20.2.254
  mgmt-net:
    name: mgmt-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.3.0/24
          gateway: 172.20.3.254
