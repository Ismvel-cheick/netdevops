# Analyse SonarQube du projet NetDevOps
sonar.projectKey=netdevops
sonar.projectName=NetDevOps - Infrastructure reseau segmentee
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Code analysé : playbooks/rôles Ansible, Dockerfiles, scripts Python et shell
sonar.sources=ansible,docker,scripts,tests,jenkins,docker-compose.yml,Jenkinsfile
# La page HTML statique est exclue : son analyseur (Node.js) est très lent sur une petite VM
sonar.exclusions=build/**,reports/**,docs/**,**/*.json,**/*.html
sonar.python.version=3

# VM aux ressources limitées : délais d'attente allongés pour l'envoi du rapport
sonar.scanner.socketTimeout=600
sonar.scanner.responseTimeout=600
